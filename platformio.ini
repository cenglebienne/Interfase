; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.filesystem = littlefs

build_flags =
    -Iinclude
    -DFW_VERSION=102
   ; -DPULSO_TREN_VALIDADOR   ; descomentar para cliente con tren de pulsos (activo-ALTO, ~5.2 ms)
  -DFACTORY_WIFI_SSID=\"Farina\"
  -DFACTORY_WIFI_PASS=\"Lacar2025\"
  -DFACTORY2_WIFI_SSID=\"Farina_EXT\"
  -DFACTORY2_WIFI_PASS=\"Lacar2025\"
  
lib_ldf_mode   = deep+
lib_extra_dirs = ../lib_shared

lib_deps =
    marvinroger/AsyncMqttClient @ ^0.9.0
    knolleary/PubSubClient @ ^2.8
    ldab/esp32_ftpclient @ ^0.1.4

; ── Entorno de prueba: calibración de pulso hacia VMC ────────────────────────
; Para borrar: eliminar test_pulso/ y este bloque [env:test_pulso]
[env:test_pulso]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
build_flags      = -Iinclude
build_src_filter = -<*> +<../test_pulso/>

; ── Entorno de prueba: captura de pulso del validador ────────────────────────
; Para borrar: eliminar test_captura/ y este bloque [env:test_captura]
[env:test_captura]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
build_flags      = -Iinclude
build_src_filter = -<*> +<../test_captura/>

; ── Entorno de prueba: replay del tren de pulsos hacia VMC ───────────────────
; Para borrar: eliminar test_replay/ y este bloque [env:test_replay]
[env:test_replay]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
build_flags      = -Iinclude
build_src_filter = -<*> +<../test_replay/>
